# The forum on the server, next to 1Panel's PostgreSQL; see docs/design.md §12 and §13.
# It lives in /opt/1panel/www/sites/mousehole/, beside .env with DATABASE_URL, PUBLIC_URL and
# APP_SECRET, and data/ owned by uid 1000, the image's node user, for uploads and avatars.
services:
  mousehole:
    image: ghcr.io/mousebaoyan/mousehole:${MOUSEHOLE_VERSION:-latest}
    container_name: mousehole
    restart: unless-stopped
    env_file: .env
    ports:
      # 3000 is taken on the server.
      - 127.0.0.1:3080:3000
    volumes:
      - ./data:/app/data
    networks:
      - 1panel-network
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  1panel-network:
    external: true
