# The 鼠洞 site in 1Panel's OpenResty; see docs/design.md §12 and §13. 1Panel writes the server
# block with the certificate; what follows goes into it in place of the reverse-proxy location it
# generates. The forum sets HSTS, CSP and its other headers itself, so leave 1Panel's HSTS option
# off for this site, and it compresses its own responses.
#
# Once, in the http block of OpenResty's nginx.conf:
#   limit_req_zone $binary_remote_addr zone=mousehole_req:10m rate=30r/s;
#   limit_conn_zone $binary_remote_addr zone=mousehole_conn:10m;
# The limits are per address and loose on purpose: a campus network can put a whole dormitory
# behind one.

# HTTP/3 holds up better on lossy cross-border links. Only one site may add `reuseport`.
listen 443 quic;
add_header Alt-Svc 'h3=":443"; ma=86400';

gzip off;
client_max_body_size 20m;
limit_conn mousehole_conn 100;

location / {
    limit_req zone=mousehole_req burst=120 nodelay;
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
}

# Event streams, for pages that update live and for the bot plugin: passed on as they come and
# kept open; the forum sends a heartbeat every 20 seconds.
location ~ ^/api/v1/(stream|bot/events|threads/[0-9]+/stream)$ {
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
}
