# The 鼠洞 site in 1Panel's OpenResty; see docs/design.md §12 and §13. It is a 1Panel reverse-proxy
# site for bbs.mousebaoyan.cn, with 1Panel's HTTPS settings doing the certificate and HTTP3 and
# with HSTS off there, since the forum sets HSTS, CSP and its other headers itself.
#
# This file replaces the site's proxy/root.conf, which 1Panel includes in the server block. It
# uses `location /`, not 1Panel's `location ^~ /`, which would keep the stream location below from
# ever matching. No add_header here either: it would drop the Alt-Svc header 1Panel adds for HTTP3.
#
# The zones go in the http block, as /opt/1panel/www/conf.d/00-mousehole-limit.conf:
#   limit_req_zone $binary_remote_addr zone=mousehole_req:10m rate=30r/s;
#   limit_conn_zone $binary_remote_addr zone=mousehole_conn:10m;
# The limits are per address and loose on purpose: a campus network can put a whole dormitory
# behind one.

# The forum compresses its own responses.
gzip off;
client_max_body_size 20m;
limit_conn mousehole_conn 100;

location / {
    limit_req zone=mousehole_req burst=120 nodelay;
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
}

# Event streams, for pages that update live and for the bot plugin: passed on as they come and
# kept open; the forum sends a heartbeat every 20 seconds.
location ~ ^/api/v1/(stream|bot/events|threads/[0-9]+/stream)$ {
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
}
