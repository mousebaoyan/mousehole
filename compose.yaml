# Local development database. Production reuses the PostgreSQL 18 instance in 1Panel.
services:
  postgres:
    image: postgres:18
    # A test run takes about 50 connections, and worktrees run theirs at the same time as each
    # other and beside the dev servers.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: mousehole
      POSTGRES_PASSWORD: mousehole
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
